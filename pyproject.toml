[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskmanager-mcp"
version = "0.1.0"
description = "High-Assurance Persistent Execution Memory & Workflow Governance MCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DeepMind Agentic Coding" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
taskmanager-mcp = "taskmanager_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskmanager_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
